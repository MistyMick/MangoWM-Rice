# Font
font_family      SpaceMono Nerd Font
font_size        13.0

# Cursor
cursor_shape     beam
cursor_trail     1

# Window
window_margin_width     8
confirm_os_window_close 0
background_opacity 0.8

# shell: our fish prints the branded readout on terminal open.
shell /usr/bin/fish

# theme palette sits next to this file.
include current-theme.conf

# Copy / paste
map ctrl+c       copy_or_interrupt
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Scroll
map page_up      scroll_page_up
map page_down    scroll_page_down

enable_audio_bell no

font_size 13.0
background_opacity   0.85

foreground #E6EBFF

color0  #667BBE
color1  #667BBE
color2  #667BBE
color3  #667BBE
color4  #667BBE
color5  #667BBE
color6  #667BBE
color7  #E6EBFF
color8  #667BBE
color9  #667BBE
color10 #667BBE
color11 #667BBE
color12 #667BBE
color13 #667BBE
color14 #667BBE
color15 #E6EBFF


# BEGIN_KITTY_THEME
# Azari Vertigo Theme
# include current-theme.conf
# END_KITTY_THEME
